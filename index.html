function renderShiftLookup(dateOverride) {
  const dateEl = document.getElementById('shiftLookupDate');
  const dateISO = dateOverride || (dateEl ? dateEl.value : new Date().toISOString().slice(0,10));
  if (dateEl && dateOverride) dateEl.value = dateOverride;

  const pStart = new Date('2026-02-08T12:00:00');
  const selDate = new Date(dateISO + 'T12:00:00');
  if (selDate < pStart) {
    document.getElementById('shiftLookupResult').innerHTML =
      `<div style="font-size:12px;color:var(--red);padding:8px 0;">Shift schedule effective from 08.02.2026. Please select a date on or after 08.02.2026.</div>`;
    return;
  }

  const recs = getShiftForDate(dateISO);
  const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][selDate.getDay()];
  const shiftColors = {Day:'#e8a020',Evening:'#20b0a0',Night:'#7060d0','Evening→Night':'#e04090',OFF:'#888'};
  const isToday = dateISO === new Date().toISOString().slice(0,10);

  // Group by shift type
  const groups = {};
  recs.forEach(s => {
    if (s.is16hrCont) return;
    if (!groups[s.shiftType]) groups[s.shiftType] = [];
    groups[s.shiftType].push(s);
  });

  const offGroup = groups['OFF'] || [];
  delete groups['OFF'];

  const onDutyCount = recs.filter(s => s.shiftType !== 'OFF' && !s.is16hrCont).length;

  // Build a map of empName -> record for quick lookup
  const recMap = {};
  recs.forEach(s => { recMap[s.empName] = s; });

  // Sort employees by seniority order
  const orderedEmps = SENIORITY_ORDER.filter(name => recMap[name]);
  // Add any employees not in seniority list at the end
  recs.forEach(s => {
    if (!SENIORITY_ORDER.includes(s.empName) && !orderedEmps.includes(s.empName)) {
      orderedEmps.push(s.empName);
    }
  });

  const tableRows = orderedEmps.map((name, idx) => {
    const s = recMap[name];
    if (!s) return '';
    const isOff = s.shiftType === 'OFF';
    const clr = isOff ? '#888' : (shiftColors[s.shiftType] || 'var(--teal)');
    const timeStr = s.shiftStart && s.shiftEnd ? s.shiftStart + '–' + s.shiftEnd : '—';
    const weekOff = WEEK_OFF[name] || '—';
    const rowBg = idx % 2 === 1 ? 'rgba(232,242,234,0.3)' : '';
    return `<tr style="border-bottom:1px solid var(--border);background:${rowBg};"
      onmouseover="this.style.background='rgba(232,242,234,0.6)'"
      onmouseout="this.style.background='${rowBg}'">
      <td style="padding:8px 10px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;">${idx + 1}</td>
      <td style="padding:8px 12px;font-size:13px;color:var(--white);font-weight:500;">
        ${esc(name)}
        ${s.is16hr ? `<span style="font-size:9px;padding:1px 5px;background:rgba(224,64,144,0.15);color:#e04090;border:1px solid rgba(224,64,144,0.3);border-radius:2px;font-family:'Space Mono',monospace;margin-left:4px;">16HR</span>` : ''}
      </td>
      <td style="padding:8px 10px;text-align:center;">
        <span style="display:inline-block;padding:3px 10px;background:${clr}18;color:${clr};
          border:1px solid ${clr}35;border-radius:3px;font-family:'Space Mono',monospace;
          font-size:11px;font-weight:700;letter-spacing:1px;">${isOff ? 'OFF' : s.shiftCode}</span>
      </td>
      <td style="padding:8px 10px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;">${timeStr}</td>
      <td style="padding:8px 10px;font-size:11px;color:var(--gold2);text-align:center;font-weight:500;">${weekOff}</td>
    </tr>`;
  }).join('');

  document.getElementById('shiftLookupResult').innerHTML = `
    <div style="border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
        color:#7060d0;letter-spacing:2px;margin-bottom:10px;">
        ${dayName.toUpperCase()}, ${dateISO}${isToday?' <span style="font-size:10px;color:var(--gold2);margin-left:8px;">◀ TODAY</span>':''}
        <span style="font-size:11px;color:var(--text2);margin-left:10px;font-weight:400;letter-spacing:1px;">
          ${onDutyCount} on duty · ${offGroup.length} off
        </span>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:480px;">
          <thead>
            <tr style="background:rgba(112,96,208,0.06);border-bottom:2px solid rgba(112,96,208,0.15);">
              <th style="padding:8px 10px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;white-space:nowrap;">Sr.</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Employee</th>
              <th style="padding:8px 10px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Shift</th>
              <th style="padding:8px 10px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Time</th>
              <th style="padding:8px 10px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Week Off</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
          </tbody>
        </table>
      </div>
    </div>`;
}

function shiftAddEntry() {
  const empName   = (document.getElementById('new_shiftEmp')?.value||'').trim();
  const shiftType = document.getElementById('new_shiftType')?.value||'Morning';
  const shiftStart= document.getElementById('new_shiftStart')?.value||'';
  const shiftEnd  = document.getElementById('new_shiftEnd')?.value||'';
  const shiftDate = document.getElementById('new_shiftDate')?.value||'';
  if (!empName) {
    const el = document.getElementById('new_shiftEmp');
    if (el) el.style.borderColor='var(--red)'; return;
  }
  const shifts = shiftLoad();
  shifts.push({id:nextId(shifts), empName, shiftType, shiftStart, shiftEnd, shiftDate});
  shiftSave(shifts);
  showShiftSchedule();
}

function shiftSaveEdit(id) {
  const shifts = shiftLoad();
  const s = shifts.find(x=>x.id===id);
  if (!s) return;
  s.empName    = document.getElementById(`se_empName_${id}`)?.value.trim()||s.empName;
  s.shiftType  = document.getElementById(`se_shiftType_${id}`)?.value||s.shiftType;
  s.shiftStart = document.getElementById(`se_shiftStart_${id}`)?.value||'';
  s.shiftEnd   = document.getElementById(`se_shiftEnd_${id}`)?.value||'';
  s.shiftDate  = document.getElementById(`se_shiftDate_${id}`)?.value||'';
  shiftSave(shifts);
  showShiftSchedule();
}

function shiftDelete(id) {
  if (!confirm('Delete this shift record?')) return;
  shiftSave(shiftLoad().filter(x=>x.id!==id));
  showShiftSchedule();
}

//  LOG SYSTEM — Task Tracker with Deadline Notifications

// Storage key
const LOG_KEY = 'fact_portal_log_v1';

function logLoad() {
  try {
    const raw = localStorage.getItem(LOG_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function logSave(entries) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(entries)); } catch(e) {}
}

function logNextId(entries) {
  return entries.length === 0 ? 1 : Math.max(...entries.map(e=>e.id)) + 1;
}

// ── Check overdue entries and show home popup ──
function checkLogDeadlines() {
  const entries = logLoad();
  if (entries.length === 0) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue = entries.filter(e => {
    if (!e.date || e.done) return false;
    const d = new Date(e.date); d.setHours(0,0,0,0);
    return d < today;
  });
  const dueTodayOrSoon = entries.filter(e => {
    if (!e.date || e.done) return false;
    const d = new Date(e.date); d.setHours(0,0,0,0);
    const diff = Math.ceil((d - today) / (1000*60*60*24));
    return diff >= 0 && diff <= 3;
  });

  if (overdue.length === 0 && dueTodayOrSoon.length === 0) return;

  // Show notification popup
  const overdueHTML = overdue.length === 0 ? '' : `
    <div style="margin-bottom:14px;">
      <div style="font-size:10px;color:var(--red);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:8px;">
        ⚠ OVERDUE — ${overdue.length} task${overdue.length>1?'s':''}
      </div>
      ${overdue.map(e=>`
        <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;
          background:rgba(192,56,40,0.07);border-left:3px solid var(--red);
          border-radius:2px;margin-bottom:6px;">
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--text2);flex-shrink:0;min-width:28px;">#${e.id}</span>
          <span style="font-size:13px;color:var(--white);flex:1;">${esc(e.work)}</span>
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--red);flex-shrink:0;">${e.date}</span>
        </div>`).join('')}
    </div>`;

  const soonHTML = dueTodayOrSoon.length === 0 ? '' : `
    <div>
      <div style="font-size:10px;color:var(--gold2);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:8px;">
        🕐 DUE SOON — ${dueTodayOrSoon.length} task${dueTodayOrSoon.length>1?'s':''}
      </div>
      ${dueTodayOrSoon.map(e=>{
        const d = new Date(e.date); d.setHours(0,0,0,0);
        const diff = Math.ceil((d - today)/(1000*60*60*24));
        const label = diff===0 ? 'TODAY' : diff===1 ? 'TOMORROW' : `${diff} DAYS`;
        return `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;
          background:rgba(176,120,0,0.07);border-left:3px solid var(--gold);
          border-radius:2px;margin-bottom:6px;">
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--text2);flex-shrink:0;min-width:28px;">#${e.id}</span>
          <span style="font-size:13px;color:var(--white);flex:1;">${esc(e.work)}</span>
          <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--gold2);flex-shrink:0;">${label}</span>
        </div>`;
      }).join('')}
    </div>`;

  document.getElementById('modalTitle').innerHTML =
    `<span style="color:var(--red);">⚠</span> Log Deadline Alert`;
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:16px;font-size:12px;color:var(--text2);line-height:1.6;">
      The following tasks have passed or are approaching their deadlines.
    </div>
    ${overdueHTML}
    ${soonHTML}
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button onclick="closeModal();enterArea('log');"
        style="flex:1;padding:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));
        border:none;border-radius:4px;font-family:'Barlow Condensed',sans-serif;
        font-size:14px;font-weight:700;letter-spacing:2px;color:var(--bg);cursor:pointer;">
        OPEN LOG →
      </button>
      <button onclick="closeModal()"
        style="padding:10px 18px;background:none;border:1px solid var(--border2);
        border-radius:4px;font-family:'Barlow Condensed',sans-serif;
        font-size:14px;color:var(--text2);cursor:pointer;">
        DISMISS
      </button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

// ── Show Log Screen ──
function showLog(editId) {
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Log',  action:()=>showLog()}
  ];
  updateBreadcrumb();

  const entries = logLoad();
  const today = new Date(); today.setHours(0,0,0,0);

  function statusBadge(e) {
    if (e.done) return `<span style="font-size:9px;padding:2px 7px;background:rgba(26,140,54,0.1);color:var(--green2);border:1px solid rgba(26,140,54,0.25);border-radius:2px;font-family:'Space Mono',monospace;">✓ DONE</span>`;
    if (!e.date) return `<span style="font-size:9px;padding:2px 7px;background:rgba(86,112,96,0.1);color:var(--text2);border:1px solid var(--border);border-radius:2px;font-family:'Space Mono',monospace;">NO DATE</span>`;
    const d = new Date(e.date); d.setHours(0,0,0,0);
    const diff = Math.ceil((d - today)/(1000*60*60*24));
    if (diff < 0)  return `<span style="font-size:9px;padding:2px 7px;background:rgba(192,56,40,0.1);color:var(--red);border:1px solid rgba(192,56,40,0.3);border-radius:2px;font-family:'Space Mono',monospace;">⚠ OVERDUE</span>`;
    if (diff === 0) return `<span style="font-size:9px;padding:2px 7px;background:rgba(176,120,0,0.12);color:var(--gold2);border:1px solid rgba(176,120,0,0.3);border-radius:2px;font-family:'Space Mono',monospace;">⚡ TODAY</span>`;
    if (diff <= 3)  return `<span style="font-size:9px;padding:2px 7px;background:rgba(176,120,0,0.08);color:var(--gold);border:1px solid rgba(176,120,0,0.2);border-radius:2px;font-family:'Space Mono',monospace;">🕐 ${diff}D LEFT</span>`;
    return `<span style="font-size:9px;padding:2px 7px;background:rgba(10,158,130,0.08);color:var(--teal);border:1px solid rgba(10,158,130,0.2);border-radius:2px;font-family:'Space Mono',monospace;">ACTIVE</span>`;
  }

  const overdueCount = entries.filter(e=>{ if(e.done||!e.date) return false; const d=new Date(e.date);d.setHours(0,0,0,0);return d<today; }).length;
  const activeCount  = entries.filter(e=>!e.done).length;

  const rows = entries.length === 0
    ? `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text2);font-size:13px;">No log entries yet. Add your first entry above.</td></tr>`
    : [...entries].reverse().map(e => {
        const isEdit = editId === e.id;
        if (isEdit) {
          return `<tr style="background:rgba(176,120,0,0.06);">
            <td style="padding:8px 10px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;">${e.id}</td>
            <td style="padding:6px 8px;"><input id="editWork_${e.id}"
              style="width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--gold);
              border-radius:3px;font-family:'Space Grotesk',-apple-system,sans-serif;font-size:13px;color:var(--text);outline:none;"
              value="${esc(e.work)}"></td>
            <td style="padding:6px 8px;"><input id="editDate_${e.id}" type="date"
              style="padding:7px 10px;background:var(--bg);border:1px solid var(--gold);

            <td style="padding:6px 8px;" colspan="2">

                  font-size:13px;font-weight:700;color:var(--bg);cursor:pointer;letter-spacing:1px;">SAVE</button>

                  border-radius:3px;font-size:12px;color:var(--text2);cursor:pointer;">Cancel</button>
              </div>

          </tr>`;
        }
        return `<tr style="border-bottom:1px solid var(--border);${e.done?'opacity:0.5;':''}"

          onmouseout="this.style.background=''">
          <td style="padding:9px 10px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;">${e.id}</td>

      }).join('');

        </div>
        <div style="flex-shrink:0;">
          <div style="font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;">Deadline Date</div>
          <input id="newDate" type="date"
            style="padding:9px 12px;background:var(--bg);
            border:1px solid var(--border2);border-radius:3px;
            font-size:14px;color:var(--text);outline:none;">
        </div>
        <button onclick="logAddEntry()"
          style="flex-shrink:0;padding:10px 24px;
          background:linear-gradient(135deg,#e06030,#c84020);
          border:none;border-radius:3px;
          font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
          letter-spacing:2px;color:#fff;cursor:pointer;white-space:nowrap;">
          ADD ENTRY
        </button>
      </div>
    </div>

    <!-- LOG TABLE -->
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:4px;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead>
          <tr style="background:rgba(224,96,48,0.07);border-bottom:2px solid rgba(224,96,48,0.25);">
            <th style="padding:10px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;width:40px;">Sl No.</th>
            <th style="padding:10px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Works</th>
            <th style="padding:10px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;white-space:nowrap;">Date</th>
            <th style="padding:10px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Status</th>
            <th style="padding:10px;text-align:right;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;">Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${entries.length>0?`
    <div style="margin-top:10px;display:flex;justify-content:flex-end;">
      <button onclick="logClearDone()"
        style="padding:6px 14px;background:none;border:1px solid var(--border2);
        border-radius:3px;font-size:11px;color:var(--text2);cursor:pointer;letter-spacing:1px;">
        Clear Completed
      </button>
    </div>`:''}
  `);

  if (editId) {
    const inp = document.getElementById(`editWork_${editId}`);
    if (inp) inp.focus();
  } else {
    const inp = document.getElementById('newWork');
    if (inp) inp.focus();
  }
}

function logAddEntry() {
  const workEl = document.getElementById('newWork');
  const dateEl = document.getElementById('newDate');
  const work = (workEl ? workEl.value : '').trim();
  if (!work) { if(workEl) workEl.style.borderColor='var(--red)'; return; }
  const date = dateEl ? dateEl.value : '';
  const entries = logLoad();
  entries.push({ id: logNextId(entries), work, date, done: false, created: new Date().toISOString().slice(0,10) });
  logSave(entries);
  showLog();
}

function logMarkDone(id) {
  const entries = logLoad();
  const e = entries.find(x=>x.id===id);
  if (e) { e.done = true; e.doneDate = new Date().toISOString().slice(0,10); }
  logSave(entries);
  showLog();
}

function logDelete(id) {
  if (!confirm('Delete this log entry?')) return;
  const entries = logLoad().filter(x=>x.id!==id);
  logSave(entries);
  showLog();
}

function logSaveEdit(id) {
  const workEl = document.getElementById(`editWork_${id}`);
  const dateEl = document.getElementById(`editDate_${id}`);
  const work = (workEl ? workEl.value : '').trim();
  if (!work) { if(workEl) workEl.style.borderColor='var(--red)'; return; }
  const date = dateEl ? dateEl.value : '';
  const entries = logLoad();
  const e = entries.find(x=>x.id===id);
  if (e) { e.work = work; e.date = date; }
  logSave(entries);
  showLog();
}

function logClearDone() {
  if (!confirm('Remove all completed entries?')) return;
  logSave(logLoad().filter(e=>!e.done));
  showLog();
}


// ============================================================
//  INIT
// ============================================================
showHome();
setTimeout(checkLogDeadlines, 600); // check deadlines 600ms after page load

</script>
</body>
</html>
