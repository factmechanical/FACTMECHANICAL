<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FACT Portal">
<meta name="theme-color" content="#f0f5f1">
<meta name="mobile-web-app-capable" content="yes">
<title>FACT | Engineering Portal v39</title>
<!-- Fonts: system stack used for privacy (no Google Fonts tracking) -->
<style>
:root {
  --bg:     #f0f5f1;
  --bg2:    #e8f0ea;
  --bg3:    #ddeae0;
  --panel:  #ffffff;
  --border: rgba(30,130,60,0.18);
  --border2:rgba(30,130,60,0.38);
  --green:  #1a8c36;
  --green2: #1a7a30;
  --green3: rgba(26,140,54,0.08);
  --gold:   #b07800;
  --gold2:  #c8900a;
  --gold3:  rgba(176,120,0,0.10);
  --teal:   #0a9e82;
  --red:    #c03828;
  --text:   #1a3020;
  --text2:  #4a6854;
  --white:  #0d1f12;
  --glow-gold:  0 0 24px rgba(176,120,0,0.18);
  --glow-green: 0 0 24px rgba(26,140,54,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Subtle dot-grid background */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0;
  background-image: radial-gradient(circle, rgba(26,140,54,0.12) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events:none;
}

/* Ambient glow top */
body::after {
  content:'';
  position:fixed; top:-200px; left:50%; transform:translateX(-50%);
  width:900px; height:400px; z-index:0;
  background: radial-gradient(ellipse, rgba(26,140,54,0.07) 0%, transparent 70%);
  pointer-events:none;
}

/* ── HEADER ── */
header {
  position:sticky; top:0; z-index:200;
  background: rgba(240,245,241,0.96);
  border-bottom: 1px solid var(--border2);
  backdrop-filter: blur(16px);
}
.hdr {
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:16px; padding:0 28px;
  height:62px;
}
.hdr-logo { display:flex; align-items:center; gap:14px; }

/* Diamond badge */
.hdr-badge {
  width:42px; height:42px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  clip-path: polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  display:flex; align-items:center; justify-content:center;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-weight:700;
  font-size:17px; color:#050c08; letter-spacing:1px;
  flex-shrink:0;
}
.hdr-org {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  font-size:26px; font-weight:700;
  color:var(--gold); letter-spacing:4px;
  line-height:1;
}
.hdr-sub {
  font-size:9.5px; color:var(--text2);
  letter-spacing:2px; text-transform:uppercase;
  margin-top:2px;
}

/* Green vertical divider */
.hdr-divider {
  width:1px; height:32px;
  background: linear-gradient(to bottom, transparent, var(--green), transparent);
  margin:0 8px;
}

.hdr-title {
  flex:1; text-align:center;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:16px; font-weight:600;
  color:var(--green2); letter-spacing:3px; text-transform:uppercase;
}
.hdr-clock {
  font-family:'Space Mono','Courier New',Courier,monospace;
  font-size:13px; color:var(--gold); text-align:right; line-height:1.5;
}
.hdr-date { font-size:9px; color:var(--text2); letter-spacing:1px; text-transform:uppercase; }

/* Green scan line on header bottom */
header::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent 0%, var(--green) 30%, var(--gold) 50%, var(--green) 70%, transparent 100%);
  opacity:0.5;
}

/* ── BREADCRUMB ── */
.breadcrumb {
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; gap:6px;
  padding:8px 28px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:11px;
  color:var(--text2); position:relative; z-index:1;
  border-bottom:1px solid var(--border);
}
.bc-item {
  cursor:pointer; color:var(--green2);
  transition:color 0.2s; padding:3px 8px;
  border:1px solid transparent; border-radius:2px;
}
.bc-item:hover { color:var(--gold); border-color:var(--border2); }
.bc-item.active { color:var(--text2); cursor:default; pointer-events:none; }
.bc-sep { color:var(--border2); }

/* ── MAIN ── */
.main { max-width:1400px; margin:0 auto; padding:0 28px 48px; position:relative; z-index:1; }

/* ── HOME STATS ── */
.home-stats {
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;
}
.stat-card {
  background: linear-gradient(140deg, rgba(255,255,255,0.95), rgba(232,242,234,0.98));
  border:1px solid var(--border);
  border-left:3px solid var(--gold);
  padding:22px 20px; border-radius:4px;
  transition: transform 0.2s, box-shadow 0.2s;
  position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; right:0;
  width:60px; height:60px;
  background: radial-gradient(circle at top right, rgba(212,160,23,0.08), transparent);
}
.stat-card:hover { transform:translateY(-3px); box-shadow: var(--glow-gold); }
.stat-n {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:46px; font-weight:700;
  color:var(--gold2); line-height:1;
}
.stat-l { font-size:10px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; margin-top:5px; }
.stat-d { font-size:12px; color:var(--text2); margin-top:6px; }

/* ── SECTION TITLE ── */
.section-title {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:12px; font-weight:600;
  color:var(--text2); letter-spacing:4px; text-transform:uppercase;
  margin:28px 0 14px; display:flex; align-items:center; gap:12px;
}
.section-title::before { content:'▸'; color:var(--green); font-size:10px; }
.section-title::after  { content:''; flex:1; height:1px; background:var(--border); }

/* ── EQUIPMENT CARDS ── */
.equip-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:10px;
}
.equip-card {
  background: var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--green);
  padding:16px 14px 16px 16px;
  cursor:pointer; transition: all 0.18s;
  border-radius:4px; position:relative; overflow:hidden;
}
.equip-card::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg, rgba(46,184,74,0.04), transparent);
  opacity:0; transition:opacity 0.2s;
}
.equip-card:hover {
  border-left-color:var(--gold);
  background: rgba(232,245,235,0.98);
  transform:translateY(-2px);
  box-shadow: var(--glow-green);
}
.equip-card:hover::after { opacity:1; }
.equip-name {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:21px; font-weight:700;
  color:var(--white); letter-spacing:0.5px;
}
.equip-sub { font-size:11px; color:var(--text2); margin-top:3px; line-height:1.5; }
.equip-badge {
  display:inline-block; margin-top:8px;
  padding:2px 8px; border-radius:2px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:10px;
  background:rgba(46,184,74,0.08); color:var(--green2);
  border:1px solid rgba(46,184,74,0.2);
}
.equip-arrow {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font-size:16px; color:var(--border2); transition:color 0.2s;
}
.equip-card:hover .equip-arrow { color:var(--gold); }

/* ── COMPRESSOR/PARTS GRID ── */
.parts-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:8px;
}
.part-card {
  background:var(--panel); border:1px solid var(--border);
  padding:14px; border-radius:4px; cursor:pointer;
  transition:all 0.15s; border-left:3px solid var(--teal);
}
.part-card:hover { background:rgba(28,196,160,0.05); border-left-color:var(--gold); }
.part-code { font-family:'Space Mono','Courier New',Courier,monospace; font-size:11px; color:var(--teal); }
.part-desc { font-size:13px; color:var(--white); margin-top:3px; line-height:1.4; font-weight:500; }
.part-meta { font-size:11px; color:var(--text2); margin-top:6px; }
.part-qty {
  display:inline-block; padding:1px 8px;
  background:rgba(212,160,23,0.1); color:var(--gold2);
  border:1px solid rgba(212,160,23,0.2); border-radius:2px;
  font-size:10px; font-family:'Space Mono','Courier New',Courier,monospace;
}

/* ── CATEGORY HEADER ── */
.cat-header {
  display:flex; align-items:flex-start; gap:20px; overflow:hidden;
  margin-bottom:28px; padding:22px 26px;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(232,242,234,0.97));
  border:1px solid var(--border); border-left:4px solid var(--gold);
  border-radius:4px; position:relative; overflow:hidden;
}
.cat-header::before {
  content:''; position:absolute; top:0; right:0;
  width:200px; height:100%;
  background: radial-gradient(ellipse at right, rgba(212,160,23,0.05), transparent);
}
.cat-equip-name {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:52px; font-weight:700;
  color:var(--gold2); line-height:1; letter-spacing:1px;
}
.cat-equip-label {
  font-size:10px; color:var(--text2); letter-spacing:3px;
  text-transform:uppercase; margin-top:4px;
}
.cat-meta { display:flex; gap:24px; margin-top:14px; flex-wrap:wrap; }
.cat-meta-item { font-size:12px; }
.cat-meta-item .lbl { color:var(--text2); text-transform:uppercase; letter-spacing:1px; font-size:9px; display:block; margin-bottom:3px; }
.cat-meta-item .val { color:var(--green2); font-family:'Space Mono','Courier New',Courier,monospace; font-size:12px; }

/* ── CATEGORY BUTTONS ── */
.cat-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:12px; margin-bottom:32px;
}
.cat-btn {
  background: var(--panel);
  border:1px solid var(--border); border-bottom:3px solid transparent;
  padding:22px 18px; cursor:pointer; border-radius:4px;
  transition:all 0.2s; text-align:left; position:relative; overflow:hidden;
}
.cat-btn:hover { transform:translateY(-3px); border-bottom-color:var(--gold); background:rgba(12,26,15,0.95); }

.cat-btn.bearing    { border-bottom-color:var(--red); }
.cat-btn.bearing:hover   { box-shadow:0 6px 24px rgba(224,80,64,0.2); background:rgba(224,80,64,0.05); }
.cat-btn.gearbox    { border-bottom-color:var(--green); }
.cat-btn.gearbox:hover   { box-shadow: var(--glow-green); background:var(--green3); }
.cat-btn.coupling   { border-bottom-color:var(--teal); }
.cat-btn.coupling:hover  { box-shadow:0 6px 24px rgba(28,196,160,0.2); background:rgba(28,196,160,0.05); }
.cat-btn.pulley     { border-bottom-color:var(--gold); }
.cat-btn.pulley:hover    { box-shadow: var(--glow-gold); background:var(--gold3); }
.cat-btn.dimensions { border-bottom-color:#a060e0; }
.cat-btn.dimensions:hover{ box-shadow:0 6px 24px rgba(160,96,224,0.2); background:rgba(160,96,224,0.05); }
.cat-btn.oilseal    { border-bottom-color:var(--teal); }
.cat-btn.oilseal:hover   { box-shadow:0 6px 24px rgba(28,196,160,0.2); background:rgba(28,196,160,0.05); }

.cat-icon  { font-size:26px; margin-bottom:12px; display:block; }
.cat-label {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:18px; font-weight:600;
  color:var(--white); letter-spacing:1px;
}
.cat-hint  { font-size:11px; color:var(--text2); margin-top:5px; line-height:1.5; }
.cat-count {
  position:absolute; top:10px; right:12px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:9px; color:var(--text2);
}

/* ── INFO SCREEN ── */
.info-header {
  display:flex; align-items:center; gap:14px; margin-bottom:24px;
  padding-bottom:14px; border-bottom:1px solid var(--border);
}
.info-title {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:34px; font-weight:700;
  color:var(--gold2); letter-spacing:2px;
}
.info-equip-tag {
  padding:4px 14px;
  background:rgba(46,184,74,0.08); color:var(--green2);
  border:1px solid rgba(46,184,74,0.25); border-radius:3px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:12px;
}
.info-fields {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:2px; border:1px solid var(--border); background:var(--border); border-radius:4px; overflow:hidden;
}
.info-field { background:var(--panel); padding:18px 20px; }
.info-field-label {
  font-size:9px; letter-spacing:2.5px; text-transform:uppercase;
  color:var(--text2); margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.info-field-label::before { content:''; width:4px; height:4px; background:var(--gold); display:inline-block; border-radius:50%; }
.info-field-val {
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:12.5px;
  color:var(--white); line-height:1.7; font-weight:400;
  word-break:break-word; overflow-wrap:anywhere;
}
.info-field-val .part { display:block; padding:4px 0; border-bottom:1px solid var(--border); }
.info-field-val .part:last-child { border-bottom:none; }
.info-field-val .empty { color:var(--text2); font-style:italic; font-size:12px; }
.info-field-val .pill {
  display:inline-block; padding:3px 10px; margin:2px 3px;
  background:rgba(46,184,74,0.08); color:var(--green2);
  border:1px solid rgba(46,184,74,0.2); border-radius:10px; font-size:12px;
}

/* ── BEARING DISPLAY ── */
.bearing-display { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.bearing-card {
  background:var(--panel); border:1px solid var(--border);
  border-left:3px solid var(--red); padding:18px; border-radius:4px;
  transition:transform 0.15s;
}
.bearing-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(224,80,64,0.15); }
.bearing-card .b-type { font-size:9px; color:var(--text2); text-transform:uppercase; letter-spacing:2px; }
.bearing-card .b-num  { font-family:'Space Mono','Courier New',Courier,monospace; font-size:18px; color:var(--white); margin:6px 0 4px; font-weight:700; }
.bearing-card .b-loc  { font-size:12px; color:#e07060; }
.bearing-card .b-note { font-size:11px; color:var(--text2); margin-top:8px; border-top:1px solid var(--border); padding-top:8px; }

/* ── MISC ── */
.na-badge {
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
  background:rgba(86,112,96,0.08); border:1px dashed var(--border2);
  border-radius:2px; font-size:12px; color:var(--text2);
}

/* ── NAV BACK ── */
.nav-back {
  display:inline-flex; align-items:center; gap:8px;
  background:none; border:1px solid var(--border2);
  color:var(--green2); padding:8px 18px;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; transition:all 0.2s; border-radius:4px; margin-bottom:20px;
  letter-spacing:0.5px;
}
.nav-back:hover { border-color:var(--gold); color:var(--gold); }

/* ── BEARING SEARCH ── */
.bear-search {
  background:rgba(9,20,16,0.6); border:1px solid var(--border);
  border-left:3px solid var(--gold);
  color:var(--white); padding:10px 16px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:13px;
  width:100%; max-width:400px; outline:none;
  margin-bottom:20px; border-radius:3px;
}
.bear-search:focus { border-color:var(--gold); box-shadow: var(--glow-gold); }
@media(max-width:600px) {
  .bear-search { width:100%; max-width:100%; font-size:16px; }
}
.bear-search::placeholder { color:var(--text2); }

/* ── COMPRESSOR SECTION HEADER ── */
.comp-section {
  background:rgba(212,160,23,0.05); border-left:3px solid var(--gold);
  padding:8px 16px; margin:16px 0 8px; border-radius:2px;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:14px; font-weight:600;
  color:var(--gold); letter-spacing:2px; text-transform:uppercase;
}

/* ── MODAL ── */
.modal-overlay {
  position:fixed; inset:0; z-index:500;
  background: rgba(0,0,0,0.40); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:#ffffff; border:1px solid var(--gold);
  border-top:3px solid var(--gold);
  width:90%; max-width:600px; max-height:80vh;
  overflow-y:auto; padding:32px;
  box-shadow:0 24px 80px rgba(0,0,0,0.85), 0 0 40px rgba(212,160,23,0.1);
  position:relative; border-radius:4px;
}
.modal-close {
  position:absolute; top:16px; right:16px;
  background:none; border:1px solid var(--border2);
  color:var(--text2); width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; transition:all 0.2s; border-radius:2px;
}
.modal-close:hover { border-color:var(--gold); color:var(--gold); }
.modal-title {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:24px; font-weight:700;
  color:var(--gold2); margin-bottom:20px; letter-spacing:1px;
}
.modal-row { display:flex; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.modal-row:last-child { border-bottom:none; }
.modal-key { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:1px; width:130px; flex-shrink:0; padding-top:2px; }
.modal-val { font-family:'Space Mono','Courier New',Courier,monospace; font-size:13px; color:var(--white); word-break:break-word; overflow-wrap:anywhere; }

/* ── TAB BAR ── */
.main-tabs {
  display:flex; gap:2px; margin-bottom:28px;
  background:rgba(232,242,234,0.95); border:1px solid var(--border);
  padding:4px; border-radius:5px; width:fit-content;
}
.main-tab {
  padding:9px 26px; border:none; background:transparent;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:14px; font-weight:600;
  color:var(--text2); letter-spacing:2px; cursor:pointer;
  text-transform:uppercase; border-radius:4px; transition:all 0.2s;
}
.main-tab:hover { color:var(--white); }
.main-tab.active { background: linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--bg); }

/* ── WELCOME BLOCK ── */
.portal-welcome { text-align:center; padding:36px 0 26px; }
.welcome-line {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:40px; font-weight:700;
  color:var(--white); letter-spacing:8px; text-transform:uppercase;
}
.welcome-line span { color:var(--gold2); }
.welcome-sub {
  font-size:11px; color:var(--text2); letter-spacing:3px;
  margin-top:8px; text-transform:uppercase;
}

/* ── AREA CARDS ── */
.areas-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:16px; margin-bottom:40px;
}
@media(max-width:1200px) { .areas-grid { grid-template-columns:repeat(3,1fr); } }
@media(max-width:900px)  { .areas-grid { grid-template-columns:repeat(2,1fr); } }
@media(max-width:600px)  { .areas-grid { grid-template-columns:1fr; } }

.area-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-top:3px solid var(--acolor, var(--green));
  padding:26px 22px 20px;
  border-radius:6px; cursor:pointer;
  transition:all 0.22s; position:relative; overflow:hidden;
  display:flex; flex-direction:column; gap:8px; min-height:200px;
}
.area-card::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at top left, var(--acolor,var(--green)), transparent 65%);
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.area-card.active:hover {
  transform:translateY(-5px);
  box-shadow: 0 10px 36px var(--aglow, rgba(46,184,74,0.22));
  border-color: var(--acolor, var(--green));
}
.area-card.active:hover::after { opacity:0.07; }
.area-card.soon { opacity:0.55; }
.area-card.soon:hover { opacity:0.75; cursor:default; }

.area-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
.area-icon { font-size:30px; line-height:1; }
.area-status-badge {
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:9px;
  padding:3px 10px; border-radius:2px; letter-spacing:1px;
}
.badge-active { background:rgba(46,184,74,0.12); color:var(--green2); border:1px solid rgba(46,184,74,0.3); }
.badge-soon   { background:rgba(86,112,96,0.1); color:var(--text2); border:1px solid var(--border); }
.area-name {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:22px; font-weight:700;
  color:var(--white); line-height:1.2; letter-spacing:1px;
}
.area-desc  { font-size:12px; color:var(--text2); line-height:1.6; flex:1; }
.area-count {
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:10px;
  color:var(--acolor, var(--green2));
  padding:5px 0; border-top:1px solid var(--border); margin-top:4px;
}
.area-arrow {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:13px; font-weight:600;
  color:var(--gold); letter-spacing:2px; opacity:0; transition:opacity 0.2s;
}
.area-card.active:hover .area-arrow { opacity:1; }

/* ── HOME SEARCH ── */
.home-search-wrap {
  position:relative; max-width:560px; margin:0 auto 28px;
}
.home-search {
  width:100%; padding:13px 20px 13px 46px;
  background:rgba(255,255,255,0.95);
  border:1px solid var(--border2);
  border-left:3px solid var(--gold);
  border-radius:4px; outline:none;
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:14px;
  color:var(--text); transition:box-shadow 0.2s, border-color 0.2s;
}
.home-search::placeholder { color:var(--text2); }
.home-search:focus { border-color:var(--gold); box-shadow:var(--glow-gold); }
.home-search-icon {
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  font-size:16px; pointer-events:none; opacity:0.5;
}
.home-search-clear {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  font-size:14px; color:var(--text2); padding:4px; display:none;
}
.home-search-clear.show { display:block; }
.search-results-hint {
  font-size:11px; color:var(--text2); letter-spacing:1px;
  margin-bottom:10px; padding-left:2px;
}

/* ── SPARES AREA ── */
.spares-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
  gap:10px; margin-bottom:32px;
}
.spare-card {
  background:var(--panel); border:1px solid var(--border);
  border-left:3px solid var(--teal);
  padding:16px 14px; border-radius:4px; cursor:pointer;
  transition:all 0.18s; position:relative;
}
.spare-card:hover {
  border-left-color:var(--gold);
  background:rgba(10,158,130,0.05);
  transform:translateY(-2px); box-shadow:0 4px 18px rgba(10,158,130,0.15);
}
.spare-card-icon { font-size:22px; margin-bottom:8px; display:block; }
.spare-card-name {
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:16px; font-weight:700;
  color:var(--white); letter-spacing:0.5px; line-height:1.3;
}
.spare-card-sub { font-size:11px; color:var(--text2); margin-top:4px; }
.spare-pending-badge {
  display:inline-block; margin-top:8px; padding:2px 8px;
  background:rgba(10,158,130,0.08); color:var(--teal);
  border:1px solid rgba(10,158,130,0.2); border-radius:2px;
  font-family:'Space Mono','Courier New',Courier,monospace; font-size:9px; letter-spacing:1px;
}


/* ── ARC TABLE ── */
.arc-table tbody tr:hover td {
  background: rgba(26,140,54,0.06);
}
.arc-table tbody tr:nth-child(even) td {
  background: rgba(232,240,234,0.5);
}
.arc-table tbody tr:nth-child(even):hover td {
  background: rgba(26,140,54,0.08);
}
.arc-table td, .arc-table th {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
}
/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--gold); }

/* ── ANIMATION ── */
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.screen { animation:fadeUp 0.28s ease; }

/* ══════════════════════════════════════
   MOBILE-FIRST RESPONSIVE STYLES
   ══════════════════════════════════════ */

/* ── Tablet (≤900px) ── */
@media(max-width:900px) {
  .hdr { padding:0 16px; height:54px; gap:10px; }
  .hdr-title { display:none; }
  .hdr-org { font-size:22px; letter-spacing:2px; }
  .hdr-sub { font-size:8px; }
  .hdr-badge { width:36px; height:36px; font-size:15px; }
  .main { padding:0 16px 40px; }
  .breadcrumb { padding:6px 16px; font-size:10px; }
  .cat-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .cat-equip-name { font-size:36px; }
  .info-fields { grid-template-columns:1fr; }
  .bearing-display { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .parts-grid { grid-template-columns:1fr; }
  .spares-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .equip-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
}

/* ── Mobile (≤600px) ── */
@media(max-width:600px) {
  /* Header */
  .hdr { padding:0 12px; height:50px; gap:8px; }
  .hdr-badge { width:32px; height:32px; font-size:13px; }
  .hdr-org { font-size:20px; letter-spacing:1px; }
  .hdr-sub { display:none; }
  .hdr-divider { display:none; }
  .hdr-clock { font-size:11px; }
  .hdr-date { display:none; }

  /* Breadcrumb */
  .breadcrumb { padding:5px 12px; font-size:9px; gap:4px; overflow-x:auto; flex-wrap:nowrap; white-space:nowrap; }
  .bc-item { padding:2px 6px; flex-shrink:0; }

  /* Main content */
  .main { padding:0 12px 60px; }

  /* Welcome */
  .welcome-line { font-size:26px; letter-spacing:4px; }
  .welcome-sub { font-size:9px; letter-spacing:2px; }

  /* Category header */
  .cat-header { padding:14px 14px; }
  .cat-equip-name { font-size:28px; }
  .cat-equip-label { font-size:9px; letter-spacing:1px; }
  .cat-meta { gap:12px; }
  .cat-meta-item .val { font-size:11px; }

  /* Category buttons */
  .cat-grid { grid-template-columns:1fr 1fr; gap:8px; }
  .cat-btn { padding:14px 12px; }
  .cat-icon { font-size:20px; margin-bottom:8px; }
  .cat-label { font-size:14px; }
  .cat-hint { font-size:10px; }

  /* Equipment grid */
  .equip-grid { grid-template-columns:1fr 1fr; gap:8px; }
  .equip-name { font-size:17px; }
  .equip-card { padding:12px 10px 12px 12px; }

  /* Info screen */
  .info-header { flex-direction:column; gap:8px; }
  .info-title { font-size:24px; }
  .info-fields { grid-template-columns:1fr; gap:1px; }
  .info-field { padding:12px 14px; }
  .info-field-val { font-size:11.5px; }

  /* Bearings */
  .bearing-display { grid-template-columns:1fr 1fr; gap:8px; }
  .bearing-card { padding:12px; }
  .bearing-card .b-num { font-size:15px; }

  /* Parts grid */
  .parts-grid { grid-template-columns:1fr; gap:6px; }
  .part-card { padding:10px 12px; }
  .part-desc { font-size:12px; }

  /* Spares grid */
  .spares-grid { grid-template-columns:1fr 1fr; gap:8px; }
  .spare-card { padding:12px 10px; }
  .spare-card-name { font-size:14px; }

  /* Tabs */
  .main-tabs { width:100%; overflow-x:auto; flex-wrap:nowrap; }
  .main-tab { padding:8px 14px; font-size:12px; letter-spacing:1px; white-space:nowrap; flex-shrink:0; }

  /* Modal */
  .modal { width:96%; padding:20px 16px; max-height:88vh; }
  .modal-title { font-size:18px; margin-bottom:14px; }
  .modal-row { flex-direction:column; gap:4px; padding-bottom:10px; margin-bottom:10px; }
  .modal-key { width:auto; font-size:9px; }
  .modal-val { font-size:12px; }

  /* Nav back */
  .nav-back { padding:7px 14px; font-size:12px; }

  /* Search */
  .bear-search { font-size:13px; padding:9px 14px; max-width:100%; }

  /* Tables — make them scroll horizontally */
  table { font-size:11px; }
  th, td { padding:6px 8px !important; }

  /* Home area buttons — stack nicely */
  .home-area-btn { font-size:13px; padding:8px 12px; }

  /* Section title */
  .section-title { font-size:11px; letter-spacing:2px; margin:18px 0 10px; }

  /* Stat card */
  .home-stats { grid-template-columns:repeat(2,1fr); gap:8px; }
  .stat-n { font-size:34px; }
}

/* ── Small mobile (≤400px) ── */
@media(max-width:400px) {
  .hdr-org { font-size:17px; }
  .cat-grid { grid-template-columns:1fr; }
  .equip-grid { grid-template-columns:1fr; }
  .bearing-display { grid-template-columns:1fr; }
  .spares-grid { grid-template-columns:1fr; }
  .main-tabs { font-size:11px; }
  .main-tab { padding:7px 10px; }
  .welcome-line { font-size:22px; }
  .modal-val { font-size:11px; }
  th, td { padding:5px 6px !important; font-size:10px; }
}

/* ── Touch targets — min 44px ── */
@media(max-width:600px) {
  .equip-card, .part-card, .spare-card, .bearing-card,
  .cat-btn, .area-card, .nav-back, .main-tab {
    -webkit-tap-highlight-color: rgba(176,120,0,0.15);
    min-height: 44px;
  }
  /* Prevent hover transform on touch */
  .equip-card:hover, .part-card:hover, .spare-card:hover,
  .area-card.active:hover { transform:none; box-shadow:none; }
}

/* ── Prevent horizontal scroll on tables ── */
@media(max-width:600px) {
  .overflow-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  div[style*="overflow-x:auto"] { -webkit-overflow-scrolling:touch; }
}
</style>

// ============================================================
let currentScreen = 'home'; // home | conveyor-list | conveyor-cats | conveyor-info | bearings | compressor
let selectedConveyor = null;
let selectedCategory = null;
let currentTab = 'conveyor'; // home tab
let breadcrumbs = [{label:'Home', action:()=>showHome()}];

function updateBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = breadcrumbs.map((b, i) => {
    const isLast = i === breadcrumbs.length - 1;
    return `${i>0?'<span class="bc-sep">›</span>':''}<span class="bc-item ${isLast?'active':''}" onclick="breadcrumbClick(${i})">${b.label}</span>`;
  }).join('');
}

function breadcrumbClick(idx) {
  if (idx === breadcrumbs.length - 1) return;
  breadcrumbs = breadcrumbs.slice(0, idx + 1);
  breadcrumbs[idx].action();
}

// Clock
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = n.toLocaleTimeString('en-IN');
  document.getElementById('cdate').textContent = n.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
tick(); setInterval(tick, 1000);

//  SCREENS
// ============================================================

function render(html) {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="screen">${html}</div>`;
  updateBreadcrumb();
}

function homeSearch(val) {
  const sq = (val||'').trim();
  if (sq.length === 0) { showHome(); return; }
  showGlobalSearch(sq);
}

function showGlobalSearch(query) {
  currentScreen = 'search';
  const q = (query||'').trim().toLowerCase();
  if (!q) { showHome(); return; }

  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Search', action:()=>showGlobalSearch(query)}
  ];
  updateBreadcrumb();

  // ── BEARINGS OFFSITE ──
  const bearOffsite = BEARINGS_OFFSITE.filter(b =>
    (b.num||'').toLowerCase().includes(q) ||
    (b.code||'').includes(q) ||
    (b.type||'').toLowerCase().includes(q) ||
    (b.eq||'').toLowerCase().includes(q) ||
    (b.app||'').toLowerCase().includes(q) ||
    (b.store||'').toLowerCase().includes(q)
  );

  // ── ARC BEARINGS (deduplicate offsite) ──
  const offsiteCodes = new Set(BEARINGS_OFFSITE.map(b=>b.code));
  const bearARC = ARC_BEARINGS.filter(b =>
    !offsiteCodes.has(b.code) && (
      (b.num||'').toLowerCase().includes(q) ||
      (b.code||'').includes(q) ||
      (b.type||'').toLowerCase().includes(q) ||
      (b.eq||'').toLowerCase().includes(q)
    )
  );

  // ── CONVEYORS ──
  const convResults = CONVEYORS.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.id||'').toLowerCase().includes(q) ||
    (c.gearbox||'').toLowerCase().includes(q) ||
    (c.gbBearings||'').toLowerCase().includes(q) ||
    (c.pulleyBearings||'').toLowerCase().includes(q) ||
    (c.plummerBlock||'').toLowerCase().includes(q) ||
    (c.drivePulley||'').toLowerCase().includes(q) ||
    (c.tailPulley||'').toLowerCase().includes(q) ||
    (c.inputCoupling||'').toLowerCase().includes(q) ||
    (c.outputCoupling||'').toLowerCase().includes(q) ||
    (c.gbOilSeal||'').toLowerCase().includes(q) ||
    (c.gearCouplingSize||'').toLowerCase().includes(q) ||
    (c.width||'').toLowerCase().includes(q) ||
    (c.length||'').toLowerCase().includes(q)
  );

  // ── COMPRESSOR PARTS ──
  const partResults = COMPRESSOR_PARTS.filter(p =>
    (p.desc||'').toLowerCase().includes(q) ||
    (p.code||'').includes(q) ||
    (p.rem||'').toLowerCase().includes(q)
  );

  // ── NH3 10000 MT EQUIPMENT ──
  const nh3Results = NH3_10000_EQUIP.filter(e =>
    (e.name||'').toLowerCase().includes(q) ||
    (e.desc||'').toLowerCase().includes(q) ||
    (e.id||'').toLowerCase().includes(q) ||
    (e.specs ? Object.entries(e.specs).some(([k,v])=>
      k.toLowerCase().includes(q) || (v||'').toString().toLowerCase().includes(q)
    ) : false)
  );

  // ── BARGES ──
  const bargeResults = BARGES.filter(b =>
    (b.name||'').toLowerCase().includes(q) ||
    (b.desc||'').toLowerCase().includes(q)
  );

  // ── SPARES SUBAREAS ──
  const spareResults = SPARES_SUBAREAS.filter(s =>
    (s.name||'').toLowerCase().includes(q) ||
    (s.desc||'').toLowerCase().includes(q) ||
    (s.id||'').toLowerCase().includes(q)
  );

  const totalHits = bearOffsite.length + bearARC.length + convResults.length +
                    partResults.length + nh3Results.length + bargeResults.length + spareResults.length;

  // ── RENDER SECTIONS ──

  const bearOffsiteHTML = bearOffsite.length === 0 ? '' : `

  const convHTML = convResults.length === 0 ? '' : `
    <div class="section-title">🔩 Conveyors (${convResults.length})</div>
    <div class="equip-grid" style="margin-bottom:20px;">
      ${convResults.map(c=>`
        <div class="equip-card" onclick="showConveyorCats('${c.id}')">
          <div class="equip-name">${c.name}</div>
          <div class="equip-sub">W: ${c.width||'—'} · L: ${c.length||'—'}</div>
          <div class="equip-badge">${c.gearbox||'—'}</div>
          <span class="equip-arrow">›</span>
        </div>`).join('')}
    </div>`;

  const partsHTML = partResults.length === 0 ? '' : `
    <div class="section-title">⚙ Compressor Parts (${partResults.length})</div>
    <div class="parts-grid" style="margin-bottom:20px;">
      ${partResults.slice(0,24).map(p=>`
        <div class="part-card" onclick="showPartDetail('${p.code}')">
          <div class="part-code">${p.code}</div>
          <div class="part-desc">${p.desc}</div>
          <div class="part-meta">Unit: ${p.unit}&nbsp;<span class="part-qty">QTY: ${p.qty}</span>${p.rem?'&nbsp;<span style="color:var(--text2);font-size:10px;">'+p.rem+'</span>':''}</div>
        </div>`).join('')}
      ${partResults.length>24?`<div style="grid-column:1/-1;font-size:11px;color:var(--text2);padding:6px 0;">...and ${partResults.length-24} more results</div>`:''}

  const nh3HTML = nh3Results.length === 0 ? '' : `

function showHomeBearingModal(code) {
  // Check offsite first (richer data), then ARC
  const ob = BEARINGS_OFFSITE.find(x => x.code === code);
  const ab = ARC_BEARINGS.find(x => x.code === code);
  const b  = ob || ab;
  if (!b) return;
  document.getElementById('modalTitle').textContent = 'Bearing: ' + b.num;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-row"><div class="modal-key">Material Code</div><div class="modal-val">${b.code}</div></div>
    <div class="modal-row"><div class="modal-key">Bearing No.</div><div class="modal-val">${b.num}</div></div>
    <div class="modal-row"><div class="modal-key">Type</div><div class="modal-val">${b.type}</div></div>
    ${ob ? `<div class="modal-row"><div class="modal-key">Equipment</div><div class="modal-val">${ob.eq||'—'}</div></div>` : ''}
    ${ob && ob.app ? `<div class="modal-row"><div class="modal-key">Application</div><div class="modal-val" style="color:var(--teal);line-height:1.6;">${ob.app}</div></div>` : ''}
    ${ob && ob.inARC==='Yes' ? '<div class="modal-row"><div class="modal-key">In ARC 2024-25</div><div class="modal-val" style="color:var(--green2);">✓ Yes — Rate Contract Item</div></div>' : ''}
    ${ob && ob.store ? `<div class="modal-row"><div class="modal-key">Store Location</div><div class="modal-val" style="color:var(--gold2);">${ob.store}</div></div>` : ''}
    ${ab ? `<div class="modal-row"><div class="modal-key">ARC Unit Price</div><div class="modal-val" style="color:var(--gold2);">₹ ${ab.price.toLocaleString('en-IN')}</div></div>` : ''}
    ${ab ? `<div class="modal-row"><div class="modal-key">Delivery Period</div><div class="modal-val">${ab.delivery}</div></div>` : ''}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function enterArea(areaId) {
  if (areaId === 'product-conveyor') showProductConveyorHome();
  else if (areaId === 'ammonia-barge') showAmmoniaBarge();
  else if (areaId === 'pat') showPAT();
  else if (areaId === 'ammonia-10000') showAmmonia10000();
  else if (areaId === 'spares') showSpares();
  else if (areaId === 'log') showLog();
  else if (areaId === 'employee') showEmployee();
}

function showSpares() {
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Spares', action:()=>showSpares()}
  ];
  updateBreadcrumb();

  const cards = SPARES_SUBAREAS.map(s => {
    const hasData = s.id === 'bearings-offsite' || s.id === 'bearings-arc' || s.id === 'unimac' || s.id === '10000mt-ctfan';
    const badgeColor = s.id==='bearings-offsite' ? 'var(--red)' : 'var(--teal)';
    const badge = hasData
      ? `<div class="spare-pending-badge" style="background:rgba(10,158,130,0.1);color:${badgeColor};border-color:rgba(10,158,130,0.3);">● DATA AVAILABLE</div>`
      : '<div class="spare-pending-badge">◌ DATA PENDING</div>';
    return `<div class="spare-card" style="${hasData ? 'border-left-color:var(--teal);' : ''}" onclick="showSpareDetail('${s.id}')">
      <span class="spare-card-icon">${s.icon}</span>
      <div class="spare-card-name">${s.name}</div>
      <div class="spare-card-sub">${s.desc}</div>
      ${badge}
    </div>`;
  }).join('');

  render(`
    <div class="cat-header" style="border-left-color:var(--teal);">
      <div>
        <div class="cat-equip-name" style="color:var(--teal);">SPARES</div>

        <div class="cat-meta">
          <div class="cat-meta-item"><span class="lbl">Sub-Areas</span><br><span class="val" style="color:var(--teal);">${SPARES_SUBAREAS.length}</span></div>

          <div class="cat-meta-item"><span class="lbl">Data</span><br><span class="val">Pending Upload</span></div>

    <div class="section-title">Select Spare Parts Category</div>

  `);
}

function showSpareDetail(spareId, filter) {
  const s = SPARES_SUBAREAS.find(x => x.id === spareId);
  if (!s) return;
  breadcrumbs = [
    {label:'Home',   action:()=>showHome()},
    {label:'Spares', action:()=>showSpares()},
    {label:s.name,   action:()=>showSpareDetail(s.id)}
  ];
  updateBreadcrumb();

  if (spareId === 'bearings-offsite') {
    showBearingsOffsite(filter || '');
    return;
  }
  if (spareId === 'bearings-arc') {
    showBearingsArc(filter || '');
    return;
  }
  if (spareId === 'unimac') {
    showUnimacParts(filter || '');
    return;
  }
  if (spareId === 'reed-medway') {
    showReedMedwayParts(filter || '');
    return;
  }
  if (spareId === 'compressor') {
    showCompressorSpares('nh3', filter || '');
    return;
  }
  if (spareId === '10000mt-ctfan') {
    showCtFanParts(filter || '');
    return;
  }

  render(`
    <button class="nav-back" onclick="showSpares()">← Back to Spares</button>
    <div class="cat-header" style="border-left-color:var(--teal);">
      <div>
        <div class="cat-equip-name" style="color:var(--teal);font-size:36px;">${s.icon} ${s.name.toUpperCase()}</div>

      </div>
    </div>
    <div style="text-align:center;padding:60px 20px;">
      <div style="font-size:52px;margin-bottom:16px;">${s.icon}</div>
      <div style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:22px;color:var(--teal);margin-bottom:10px;letter-spacing:1px;">${s.name}</div>

  `);

function filterCompressorSpares(val, tab) {
  const f = (val||'').toLowerCase().trim();
  let list = tab === 'nh3' ? NH3_COMP_PARTS : COMPRESSOR_PARTS;
  if (f) list = list.filter(p =>
    p.code.includes(f) ||
    p.desc.toLowerCase().includes(f) ||
    (p.unit||'').toLowerCase().includes(f) ||
    (p.rem||'').toLowerCase().includes(f)
  );
  const resultsEl = document.getElementById('compSpareResults');
  const countEl   = document.getElementById('compSpareCount');
  if (resultsEl) {
    resultsEl.innerHTML = list.length === 0
      ? '<span class="na-badge">⚠ No results found</span>'
      : _compSpareMakeTable(list);
  }
  if (countEl) countEl.textContent = list.length;
}

        <div onclick="showCompressorSpares('${t.id}')"
          style="padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid ${_activeCompTab===t.id?'var(--teal)':'var(--border)'};
          background:${_activeCompTab===t.id?'rgba(10,158,130,0.1)':'var(--panel)'};transition:all 0.15s;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
            color:${_activeCompTab===t.id?'var(--teal)':'var(--text2)'};letter-spacing:1px;">${t.label}</div>
          <div style="font-size:10px;color:var(--text2);margin-top:2px;">${t.sublabel}</div>
        </div>`).join('')}
    </div>
    <div style="position:relative;max-width:480px;margin-bottom:16px;">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:15px;">🔍</span>
      <input id="compSpareSearch" class="bear-search" style="padding-left:40px;width:100%;max-width:100%;box-sizing:border-box;"
        placeholder="Search SAP code, description, unit…"
        value="${f}"
        oninput="filterCompressorSpares(this.value,'${_activeCompTab}')"
        autocomplete="off">
    </div>
    <div id="compSpareResults">
      ${list.length===0 ? '<span class="na-badge">⚠ No results found</span>' : _compSpareMakeTable(list)}
    </div>
  `);

  const inp = document.getElementById('compSpareSearch');
  if (inp && f) { inp.focus(); inp.setSelectionRange(f.length, f.length); }
}

// Unified bearing data: combines BEARINGS_OFFSITE + ARC_BEARINGS
function _buildUnifiedBearingList() {
  const offsiteList = BEARINGS_OFFSITE.map(b => ({
    source:'offsite', code:b.code, num:b.num, type:b.type,
    eq:b.eq, app:b.app||'', inARC:b.inARC||'', store:b.store||'',
    qty:'', price:null, delivery:''
  }));
  const arcList = ARC_BEARINGS.map(b => ({
    source:'arc', code:b.code, num:b.num, type:b.type,
    eq:b.eq||'', app:'', inARC:'Yes', store:'',
    qty:b.qty, price:b.price, delivery:b.delivery
  }));
  // Merge: prefer offsite entry if code exists in both (it has richer info)
  const offsiteCodes = new Set(offsiteList.map(b => b.code));
  const arcOnly = arcList.filter(b => !offsiteCodes.has(b.code));
  return { offsiteList, arcOnly, allBearings: [...offsiteList, ...arcOnly] };
}

function _renderBearingList(mode, filter) {
  const f = (filter || '').toLowerCase().trim();
  const { offsiteList, arcOnly, allBearings } = _buildUnifiedBearingList();

  const modeList = mode === 'offsite'
    ? allBearings.filter(b => b.source === 'offsite')
    : allBearings.filter(b => b.source === 'arc' || b.inARC === 'Yes');

  let list = modeList;
  if (f) list = list.filter(b =>
    b.num.toLowerCase().includes(f) ||
    b.code.includes(f) ||
    b.type.toLowerCase().includes(f) ||
    b.eq.toLowerCase().includes(f) ||
    b.app.toLowerCase().includes(f) ||
    b.store.toLowerCase().includes(f)
  );

  const rows = list.map(b => {
    const srcBadge = b.source==='offsite'
      ? `<span style="font-size:9px;padding:1px 5px;background:rgba(10,158,130,0.12);color:var(--teal);border:1px solid rgba(10,158,130,0.25);border-radius:2px;margin-left:6px;font-family:'Space Mono','Courier New',Courier,monospace;">OFFSITE</span>`
      : `<span style="font-size:9px;padding:1px 5px;background:rgba(26,140,54,0.12);color:var(--green2);border:1px solid rgba(26,140,54,0.25);border-radius:2px;margin-left:6px;font-family:'Space Mono','Courier New',Courier,monospace;">ARC</span>`;
    const arcBadge = (b.source==='arc'||b.inARC==='Yes') ? srcBadge : '';
    const offsiteBadge = b.source==='offsite' ? srcBadge : '';
    const badge = b.source==='offsite' ? offsiteBadge : arcBadge;
    return `<tr onclick="showUnifiedBearingModal('${b.source}','${b.code}')" style="cursor:pointer;">
      <td style="font-family:'Space Mono','Courier New',Courier,monospace;font-size:11px;color:var(--teal);white-space:nowrap;">${b.code}</td>
      <td style="font-family:'Space Mono','Courier New',Courier,monospace;font-size:13px;color:var(--white);font-weight:600;white-space:nowrap;">${b.num}${badge}</td>
      <td style="font-size:11px;color:var(--text2);">${b.type}</td>
      <td style="font-size:11px;color:var(--text2);max-width:200px;">${b.eq||b.app||'—'}</td>
      ${b.price!==null ? `<td style="font-family:'Space Mono','Courier New',Courier,monospace;font-size:11px;text-align:right;color:var(--gold2);white-space:nowrap;">₹ ${b.price.toLocaleString('en-IN')}</td>` : '<td style="font-size:11px;color:var(--text2);text-align:right;">—</td>'}
      <td style="font-size:10px;color:var(--text2);">${b.delivery||'—'}</td>
    </tr>`;
  }).join('');

  const isOffsite  = mode === 'offsite';
  const color      = isOffsite ? 'var(--red)' : 'var(--green2)';
  const icon       = isOffsite ? '🔴' : '✅';
  const title      = isOffsite ? 'OFFSITE BEARING' : 'ARC BEARING';
  const subtitle   = isOffsite ? 'Offsite Bearing Records' : 'ARC 2024-25 Bearing Tender (Tender: 2024_FACT_791676_1)';
  const searchFn   = isOffsite ? 'showBearingsOffsite' : 'showBearingsArc';
  const searchId   = isOffsite ? 'offsiteBearSearch' : 'arcBearSearch';

  render(`
    <button class="nav-back" onclick="showSpares()">← Back to Spares</button>
    <div class="cat-header" style="border-left-color:${color};">
      <div>
        <div class="cat-equip-name" style="color:${color};">${icon} ${title}</div>
        <div class="cat-equip-label">${subtitle}</div>
        <div class="cat-meta">
          <div class="cat-meta-item"><span class="lbl">Total Records</span><br><span class="val" style="color:${color};">${modeList.length}</span></div>
          <div class="cat-meta-item"><span class="lbl">Showing</span><br><span class="val">${list.length}</span></div>
        </div>
      </div>
    </div>
    <div style="position:relative;max-width:520px;margin-bottom:16px;">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:15px;">🔍</span>
      <input id="${searchId}" class="bear-search" style="padding-left:40px;width:100%;max-width:100%;box-sizing:border-box;"
        placeholder="Search bearing no., code, equipment, application…"
        value="${esc(f)}" oninput="${searchFn}(this.value)" autocomplete="off">
    </div>
    ${list.length===0 ? `<div style="padding:40px;text-align:center;color:var(--text2);">No results for "<strong style="color:var(--gold)">${esc(f)}</strong>"</div>` : ''}
    ${list.length>0 ? `
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:4px;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead>
          <tr style="background:rgba(26,140,54,0.08);border-bottom:2px solid var(--border2);">
            <th style="padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;white-space:nowrap;">Mat. Code</th>
            <th style="padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;">Bearing No.</th>
            <th style="padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;">Type</th>
            <th style="padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;">Equipment / Application</th>
            <th style="padding:10px 14px;text-align:right;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;white-space:nowrap;">Unit Price</th>
            <th style="padding:10px 14px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;font-weight:600;">Delivery</th>
          </tr>
        </thead>

      </table>
    </div>
    <div style="margin-top:10px;font-size:10px;color:var(--text2);text-align:right;letter-spacing:1px;">Click any row for full details</div>
    ` : ''}
  `);

  if (f) { const inp=document.getElementById(searchId); if(inp){inp.focus();inp.setSelectionRange(f.length,f.length);} }
}

function showBearingsOffsite(filter) { _renderBearingList('offsite', filter); }

function showUnifiedBearingModal(source, code) {
  let b;
  let extra = '';
  if (source === 'offsite') {
    b = BEARINGS_OFFSITE.find(x => x.code === code);
    if (!b) return;
    extra = `
      <div class="modal-row"><div class="modal-key">Application</div><div class="modal-val" style="color:var(--teal);line-height:1.6;">${b.app||'—'}</div></div>
      ${b.inARC==='Yes' ? '<div class="modal-row"><div class="modal-key">In ARC 2024-25</div><div class="modal-val" style="color:var(--green2);">✓ Yes</div></div>' : ''}
      ${b.store ? `<div class="modal-row"><div class="modal-key">Store Location</div><div class="modal-val" style="color:var(--gold2);">${b.store}</div></div>` : ''}
    `;
  } else {
    b = ARC_BEARINGS.find(x => x.code === code);
    // Also check offsite for richer info
    const ob = BEARINGS_OFFSITE.find(x => x.code === code);
    if (!b) return;
    extra = `
      ${ob ? `<div class="modal-row"><div class="modal-key">Application</div><div class="modal-val" style="color:var(--teal);line-height:1.6;">${ob.app||'—'}</div></div>` : ''}
      <div class="modal-row"><div class="modal-key">Tendered Qty</div><div class="modal-val">${b.qty}</div></div>
      <div class="modal-row"><div class="modal-key">Unit Price</div><div class="modal-val" style="color:var(--gold2);">₹ ${b.price.toLocaleString('en-IN')}</div></div>
      <div class="modal-row"><div class="modal-key">Delivery Period</div><div class="modal-val">${b.delivery}</div></div>
      <div class="modal-row"><div class="modal-key">Contract</div><div class="modal-val">ARC 2024-25 | Tender: 2024_FACT_791676_1</div></div>
    `;
  }
  document.getElementById('modalTitle').textContent = 'Bearing: ' + b.num;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-row"><div class="modal-key">Material Code</div><div class="modal-val">${b.code}</div></div>
    <div class="modal-row"><div class="modal-key">Bearing No.</div><div class="modal-val">${b.num}</div></div>
    <div class="modal-row"><div class="modal-key">Type</div><div class="modal-val">${b.type}</div></div>
    <div class="modal-row"><div class="modal-key">Equipment</div><div class="modal-val">${b.eq||'—'}</div></div>
    ${extra}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function showBargeDetail(bargeId) {
  const b = BARGES.find(x => x.id === bargeId);

  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Ammonia Barge', action:()=>showAmmoniaBarge()},
    {label:b.name, action:()=>showBargeDetail(b.id)}

    <div class="cat-btn ${cat.cls}" onclick="showBargeEquip('${b.id}','${cat.id}')">

function showBargeEquip(bargeId, catId) {
  const b = BARGES.find(x => x.id === bargeId);
  const cat = BARGE_EQUIP_CATS.find(x => x.id === catId);
  if (!b || !cat) return;
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Ammonia Barge', action:()=>showAmmoniaBarge()},
    {label:b.name, action:()=>showBargeDetail(b.id)},
    {label:cat.label, action:()=>showBargeEquip(b.id, cat.id)}
  ];
  updateBreadcrumb();

  const equipData = BARGE_EQUIP_DATA[catId] || {};
  const equipNames = Object.keys(equipData);

  let contentHTML = '';
  if (equipNames.length === 0) {
    contentHTML = '<span class="na-badge">No data available for this category</span>';
  } else {
    contentHTML = equipNames.map(eqName => {
      const fields = equipData[eqName];
      const rows = Object.entries(fields).map(([k,v]) => `
        <div class="info-field">
          <div class="info-field-label">${k}</div>
          <div class="info-field-val">${v}</div>
        </div>`).join('');
      return `
        <div style="margin-bottom:28px;">
          <div style="font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#3890e0;
                      padding:10px 16px;background:rgba(56,140,220,0.08);border-left:4px solid #3890e0;
                      margin-bottom:2px;letter-spacing:1px;">
            ${eqName}
          </div>
          <div class="info-fields">${rows}</div>
        </div>`;
    }).join('');
  }

  render(`
    <button class="nav-back" onclick="showBargeDetail('${b.id}')">← Back to ${b.name}</button>
    <div class="info-header">
      <div class="info-title">${cat.label.toUpperCase()}</div>
      <div class="info-equip-tag" style="color:#3890e0;border-color:rgba(56,140,220,0.4);">${b.name}</div>
    </div>
    ${contentHTML}
  `);
}

function showPATItem(type, itemId) {
  let item, color, typeLabel;
  if (type === 'tank')  { item = PAT_TANKS.find(x=>x.id===itemId);  color='#20c0a0'; typeLabel='Tank'; }
  if (type === 'pump')  { item = PAT_PUMPS.find(x=>x.id===itemId);  color='#e8a020'; typeLabel='Transfer Pump'; }
  if (type === 'valve') { item = PAT_VALVES.find(x=>x.id===itemId); color='#e05030'; typeLabel='Valve'; }
  if (!item) return;

  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'PAT', action:()=>showPAT()},
    {label:item.name, action:()=>showPATItem(type, itemId)}
  ];
  updateBreadcrumb();

  // Build specs table if item has specs
  let specsHTML = '';
  if (item.specs) {
    const rows = Object.entries(item.specs).map(([k,v]) => `
      <div class="info-field">
        <div class="info-field-label">${k}</div>
        <div class="info-field-val">${v}</div>
      </div>`).join('');
    specsHTML = `<div class="info-fields">${rows}</div>`;
  }

  // Note / interchangeability warning
  let noteHTML = '';
  if (item.note) {
    noteHTML = `
      <div style="margin-top:20px;padding:14px 18px;background:rgba(232,160,32,0.08);
                  border-left:4px solid #e8a020;border-radius:2px;font-size:13px;
                  color:var(--text2);line-height:1.8;">
        <span style="color:#e8a020;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;
                     letter-spacing:1px;display:block;margin-bottom:6px;">⚠ INTERCHANGEABILITY NOTE</span>
        ${item.note}
      </div>`;
  }

  // Pending placeholder for items without specs yet
  let bodyHTML = specsHTML
    ? `<div style="margin-bottom:8px;font-family:'Rajdhani',sans-serif;font-size:18px;
                  font-weight:700;color:${color};padding:10px 16px;
                  background:rgba(232,160,32,0.08);border-left:4px solid ${color};
                  letter-spacing:1px;">${item.name} — Technical Specifications</div>
       ${specsHTML}${noteHTML}`
    : `<div style="text-align:center;padding:60px 20px;">
         <div style="font-size:48px;margin-bottom:16px;">${item.icon}</div>
         <div style="font-family:'Rajdhani',sans-serif;font-size:22px;color:${color};margin-bottom:10px;">${item.name}</div>
         <div style="font-size:13px;color:var(--text2);line-height:1.8;max-width:420px;margin:0 auto;">
           Data pending — please provide specifications for this ${typeLabel.toLowerCase()}.
         </div>
       </div>`;

  render(`
    <button class="nav-back" onclick="showPAT()">← Back to PAT Area</button>
    <div class="cat-header" style="border-left-color:${color};">
      <div>
        <div class="cat-equip-name" style="color:${color};">${item.name.toUpperCase()}</div>
        <div class="cat-equip-label">PAT Area · ${typeLabel} · Technical Data</div>
      </div>
    </div>
    ${bodyHTML}
  `);
}

function showAmmonia10000() {
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'NH3 — 10000 MT', action:()=>showAmmonia10000()}
  ];
  updateBreadcrumb();

  function makeCard(e) {
    var hasData = e.specs !== null;
    var badgeStyle = hasData
      ? 'background:rgba(46,184,74,0.1);color:#4ddb6a;border:1px solid rgba(46,184,74,0.25);'
      : 'background:rgba(112,144,176,0.08);color:#567060;border:1px solid rgba(52,180,80,0.14);';
    var badgeTxt = hasData ? '● Data Available' : '◌ Data Pending';
    return '<div class="equip-card" style="border-left-color:' + e.color + ';min-height:140px;" onclick="showNH3_10000_Item(\'' + e.id + '\')">'
         + '<div style="font-size:24px;margin-bottom:8px;">' + e.icon + '</div>'
         + '<div class="equip-name" style="font-size:16px;">' + e.name + '</div>'
         + '<div class="equip-sub">' + e.desc + '</div>'
         + '<div class="equip-badge" style="margin-top:8px;' + badgeStyle + '">' + badgeTxt + '</div>'
         + '<span class="equip-arrow">›</span>'
         + '</div>';
  }

  var compCards = NH3_10000_EQUIP.slice(0,2).map(makeCard).join('');
  var pumpCards = NH3_10000_EQUIP.slice(2,7).map(makeCard).join('');
  var utilCards = NH3_10000_EQUIP.slice(7).map(makeCard).join('');

  var html = ''
    + '<div class="cat-header" style="border-left-color:#e05080;">'
    +   '<div>'
    +     '<div class="cat-equip-name" style="color:#e05080;">NH3 — 10000 MT</div>'
    +     '<div class="cat-equip-label">Ammonia Handling 10000 MT · Equipment Technical Data</div>'
    +     '<div class="cat-meta">'
    +       '<div class="cat-meta-item"><span class="lbl">Total Equipment</span><br><span class="val" style="color:#e05080;">9</span></div>'
    +       '<div class="cat-meta-item"><span class="lbl">Compressors</span><br><span class="val">2</span></div>'
    +       '<div class="cat-meta-item"><span class="lbl">Pumps</span><br><span class="val">4</span></div>'
    +       '<div class="cat-meta-item"><span class="lbl">Utility</span><br><span class="val">3</span></div>'
    +     '</div>'
    +   '</div>'
    + '</div>'
    + '<div class="section-title">Compressors</div>'
    + '<div class="equip-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:28px;">' + compCards + '</div>'
    + '<div class="section-title">Pumps &amp; Transfer Equipment</div>'
    + '<div class="equip-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:28px;">' + pumpCards + '</div>'
    + '<div class="section-title">Utility Equipment</div>'
    + '<div class="equip-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));">' + utilCards + '</div>';

  render(html);
}

function showNH3_10000_Item(itemId) {
  var item = NH3_10000_EQUIP.find(function(x){ return x.id === itemId; });
  if (!item) return;
  breadcrumbs = [
    {label:'Home',           action:function(){ showHome(); }},
    {label:'NH3 — 10000 MT', action:function(){ showAmmonia10000(); }},
    {label:item.name,        action:function(){ showNH3_10000_Item(item.id); }}
  ];
  updateBreadcrumb();

  var bodyHTML = '';
  if (item.specs) {
    var rows = Object.entries(item.specs).map(function(kv){
      return '<div class="info-field">'
           + '<div class="info-field-label">' + kv[0] + '</div>'
           + '<div class="info-field-val">'   + kv[1] + '</div>'
           + '</div>';
    }).join('');
    bodyHTML = '<div style="margin-bottom:8px;font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;color:' + item.color + ';padding:10px 16px;background:rgba(224,80,128,0.07);border-left:4px solid ' + item.color + ';letter-spacing:1px;">'
             + item.name + ' — Technical Specifications</div>'
             + '<div class="info-fields">' + rows + '</div>';
  } else {
    bodyHTML = '<div style="text-align:center;padding:60px 20px;">'
             + '<div style="font-size:48px;margin-bottom:16px;">' + item.icon + '</div>'
             + '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;color:' + item.color + ';margin-bottom:10px;letter-spacing:1px;">' + item.name + '</div>'
             + '<div style="font-size:13px;color:var(--text2);line-height:1.8;max-width:420px;margin:0 auto;">'
             + 'Technical specifications for this equipment will appear here.<br>Please provide the data and it will be added immediately.'
             + '</div></div>';
  }

  render('<button class="nav-back" onclick="showAmmonia10000()">← Back to 10000 MT</button>'
    + '<div class="cat-header" style="border-left-color:' + item.color + ';">'
    +   '<div>'
    +     '<div class="cat-equip-name" style="color:' + item.color + ';font-size:30px;">' + item.name.toUpperCase() + '</div>'
    +     '<div class="cat-equip-label">Ammonia Handling 10000 MT · Technical Data</div>'
    +   '</div>'
    + '</div>'
    + bodyHTML);
}

function showProductConveyorHome() {
  currentTab = 'conveyor';
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Product Conveyor', action:()=>showProductConveyorHome()}
  ];
  updateBreadcrumb();

  const subTabs = [
    {id:'conveyor', icon:'🔩', label:'Belt Conveyors'},
    {id:'bearings', icon:'🔘', label:'Bearings Offsite'},
    {id:'compressor', icon:'⚙', label:'Compressor Parts'},
  ];

  const tabBar = `<div class="main-tabs" style="margin-bottom:24px;">
    ${subTabs.map(t=>`<button class="main-tab ${currentTab===t.id?'active':''}" onclick="setPCTab('${t.id}')">${t.icon} ${t.label}</button>`).join('')}
  </div>`;

  let content = '';
  if (currentTab === 'conveyor') {
    content = `
    <div class="section-title">Select Conveyor — ${CONVEYORS.length} systems</div>
    <div class="equip-grid">
      ${CONVEYORS.map(c => `
        <div class="equip-card" onclick="showConveyorCats('${c.id}')">
          <div class="equip-name">${c.name}</div>
          <div class="equip-sub">Width: ${c.width||'—'}</div>
          <div class="equip-badge">${c.length||'—'} · ${c.grade||'—'}</div>
          <span class="equip-arrow">›</span>
        </div>`).join('')}
    </div>`;
  } else if (currentTab === 'bearings') {
    content = renderBearingsScreen();
  } else {
    content = renderCompressorScreen();
  }

  render(tabBar + content);
}

function setPCTab(tab) {
  currentTab = tab;
  showProductConveyorHome();
}

// ---------- CONVEYOR INFO DETAIL ----------
function showConveyorInfo(conveyorId, category) {
  const c = CONVEYORS.find(x => x.id === conveyorId);
  if (!c) return;
  selectedConveyor = c;
  selectedCategory = category;

  const catNames = {bearings:'Bearings', gearbox:'Gear Box', coupling:'Couplings', pulley:'Pulleys', dimensions:'Dimensions', oilseal:'Oil Seals'};
  breadcrumbs = [
    {label:'Home', action:()=>showHome()},
    {label:'Product Conveyor', action:()=>showProductConveyorHome()},
    {label:c.name, action:()=>showConveyorCats(c.id)},
    {label:catNames[category], action:()=>showConveyorInfo(c.id,category)}
  ];
  updateBreadcrumb();

  let fieldsHTML = '';

  if (category === 'bearings') {
    const bearingItems = [];
    if (c.gbBearings) bearingItems.push({loc:'Gear Box Bearings', val:c.gbBearings});
    if (c.pulleyBearings) bearingItems.push({loc:'Pulley Bearings', val:c.pulleyBearings});
    if (c.plummerBlock) bearingItems.push({loc:'Plummer Block', val:c.plummerBlock});

    if (bearingItems.length === 0) {
      fieldsHTML = '<span class="na-badge">⚠ No bearing data available for this conveyor</span>';
    } else {
      fieldsHTML = '<div class="bearing-display">' + bearingItems.map(b => {
        const parts = b.val.split('\n').filter(p=>p.trim());
        return `<div class="bearing-card">
          <div class="b-type">${b.loc}</div>
          ${parts.map(p=>`<div class="b-num">${p.trim()}</div>`).join('')}
          <div class="b-note">Click bearing number to search in offsite database</div>
        </div>`;
      }).join('') + '</div>';
    }

  } else if (category === 'gearbox') {
    fieldsHTML = buildFields([
      {lbl:'Gear Box Model', val:c.gearbox},
      {lbl:'Gear Ratio', val:c.ratio},
    ]);
  } else if (category === 'coupling') {
    fieldsHTML = buildFields([
      {lbl:'Input Coupling', val:c.inputCoupling},
      {lbl:'Output Coupling', val:c.outputCoupling},
      {lbl:'Gear Coupling Sizes', val:c.gearCouplingSize},
    ]);
  } else if (category === 'pulley') {
    fieldsHTML = buildFields([
      {lbl:'Drive Pulley', val:c.drivePulley},
      {lbl:'Tail Pulley', val:c.tailPulley},
      {lbl:'Take-up Pulley', val:c.takeupPulley},
      {lbl:'Bend Pulley', val:c.bendPulley},
    ]);
  } else if (category === 'dimensions') {
    fieldsHTML = buildFields([
      {lbl:'Conveyor Width', val:c.width},
      {lbl:'Conveyor Length', val:c.length},
      {lbl:'Grade / Voltage', val:c.grade},
    ]);
  } else if (category === 'oilseal') {
    fieldsHTML = buildFields([
      {lbl:'GB Oil Seal', val:c.gbOilSeal},
    ]);
  }

  render(`
    <button class="nav-back" onclick="showConveyorCats('${c.id}')">← Back to ${c.name}</button>
    <div class="info-header">
      <div class="info-title">${catNames[category].toUpperCase()}</div>
      <div class="info-equip-tag">${c.name}</div>
    </div>
    ${fieldsHTML}
  `);
}

function buildFields(fields) {
  const rows = fields.filter(f => f.val && f.val.trim() && f.val !== '-' && f.val.toLowerCase() !== 'nil');
  const empty = fields.filter(f => !f.val || !f.val.trim() || f.val === '-' || f.val.toLowerCase() === 'nil');
  if (rows.length === 0) return '<span class="na-badge">⚠ No data available for this category</span>';
  return `<div class="info-fields">
    ${rows.map(f => {
      const parts = f.val.split('\n').map(p=>p.trim()).filter(p=>p);
      const val = parts.length > 1
        ? parts.map(p=>`<span class="part">${p}</span>`).join('')
        : f.val;
      return `<div class="info-field">
        <div class="info-field-label">${f.lbl}</div>
        <div class="info-field-val">${val}</div>
      </div>`;
    }).join('')}
    ${empty.map(f => `<div class="info-field">
      <div class="info-field-label">${f.lbl}</div>
      <div class="info-field-val"><span class="empty">Not applicable / No data</span></div>
    </div>`).join('')}
  </div>`;
}

let empSortDir   = 'asc';  // 'asc' | 'desc'

function empCompareBy(a, b, field) {
  if (field === 'id') return a.id - b.id;
  const av = (a[field] || '').toString().toLowerCase();
  const bv = (b[field] || '').toString().toLowerCase();
  if (av < bv) return -1;
  if (av > bv) return 1;
  return 0;
}
function empSortedList(list) {
  if (!empSortField) return list;
  const dir = empSortDir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => empCompareBy(a, b, empSortField) * dir);
}
function empSetSort(field) {
  if (empSortField === field) {
    empSortDir = empSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    empSortField = field;
    empSortDir = 'asc';
  }
  showEmpData();
}
function empSortArrow(field) {
  if (empSortField !== field) return '';
  return empSortDir === 'asc'
    ? ' <span style="font-size:9px;">▲</span>'
    : ' <span style="font-size:9px;">▼</span>';
}

  try {
    const raw = localStorage.getItem(SHIFT_KEY);
    if (raw === null) {
      localStorage.setItem(SHIFT_KEY, JSON.stringify(SHIFT_DEFAULT));
      return SHIFT_DEFAULT;
    }
    return JSON.parse(raw);
  } catch(e) { return SHIFT_DEFAULT; }
}

function empAddEntry() {
  const fields = ['empName','empDesig','empDept','empBadge','empContact','empEmail','empJoin'];
  const val = {};
  let ok = true;
  fields.forEach(f => {
    const el = document.getElementById('new_'+f);
    val[f] = el ? el.value.trim() : '';
  });
  if (!val.empName) {
    const el = document.getElementById('new_empName');
    if (el) el.style.borderColor='var(--red)';
    ok = false;
  }
  if (!ok) return;
  const emps = empLoad();
  emps.push({id:nextId(emps), ...val});
  empSave(emps);
  showEmpData();
}

function empSaveEdit(id) {
  const fields = ['empName','empDesig','empDept','empBadge','empContact','empEmail','empJoin'];
  const emps = empLoad();
  const e = emps.find(x=>x.id===id);
  if (!e) return;
  fields.forEach(f => {
    const el = document.getElementById(`e_${f}_${id}`);
    if (el) e[f] = el.value.trim();
  });
  if (!e.empName) return;
  empSave(emps);
  showEmpData();
}

function empDelete(id) {
  if (!confirm('Delete this employee record?')) return;
  empSave(empLoad().filter(x=>x.id!==id));
  showEmpData();
}

// Returns day index (0=Sun...6=Sat) for a given ISO date string
function getDayIdx(dateISO) {
  const d = new Date(dateISO + 'T12:00:00');
  const msPerDay = 86400000;
  const dayOffset = Math.round((d - SHIFT_PATTERN_START) / msPerDay);
  return dayOffset >= 0 ? dayOffset % 7 : -1;
}

// Check if E->N continuous (16hr) duty applies for an employee on a given date
// Returns true if: today=N and yesterday=E for the same employee
function is16HrDuty(empName, dateISO) {
  if (!SHIFT_SCHEDULE_PATTERN[empName]) return false;
  const todayIdx = getDayIdx(dateISO);
  if (todayIdx < 0) return false;
  const todayCode = SHIFT_SCHEDULE_PATTERN[empName][todayIdx];
  if (todayCode !== 'N') return false;
  // Check previous day code (wrap around week)
  const prevIdx = (todayIdx + 6) % 7;
  const prevCode = SHIFT_SCHEDULE_PATTERN[empName][prevIdx];
  return prevCode === 'E';
}

// Check if today is the START of a 16hr duty (E day, and next day is N)
function is16HrStart(empName, dateISO) {
  if (!SHIFT_SCHEDULE_PATTERN[empName]) return false;
  const todayIdx = getDayIdx(dateISO);
  if (todayIdx < 0) return false;
  const todayCode = SHIFT_SCHEDULE_PATTERN[empName][todayIdx];
  if (todayCode !== 'E') return false;
  const nextIdx = (todayIdx + 1) % 7;
  const nextCode = SHIFT_SCHEDULE_PATTERN[empName][nextIdx];
  return nextCode === 'N';
}

function getShiftCodeForDate(empName, dateISO) {
  const dayIdx = getDayIdx(dateISO);
  if (dayIdx < 0) return null;
  if (SHIFT_SCHEDULE_PATTERN[empName]) return SHIFT_SCHEDULE_PATTERN[empName][dayIdx];
  if (SHIFT_DAY_ONLY.includes(empName)) {
    // Check if this date is the employee's week off day
    const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(dateISO + 'T12:00:00').getDay()];
    if (WEEK_OFF[empName] && WEEK_OFF[empName].toLowerCase() === dayName.toLowerCase()) return 'OFF';
    return 'D';
  }
  return null;
}

function getShiftForDate(dateISO) {
  const dayIdx = getDayIdx(dateISO);
  if (dayIdx < 0) return [];
  const result = [];

  Object.entries(SHIFT_SCHEDULE_PATTERN).forEach(([name, pattern]) => {
    const code  = pattern[dayIdx];
    const info  = SHIFT_CODE_MAP[code];
    const start16 = is16HrStart(name, dateISO);
    const cont16  = is16HrDuty(name, dateISO);
    let displayType  = info.type;
    let displayStart = info.start;
    let displayEnd   = info.end;
    let badge16      = false;

    if (start16) {
      // E day that continues into N next day — show as 16-hr start
      displayType  = 'Evening→Night';
      displayStart = '16:00';
      displayEnd   = '08:00 (+1)';
      badge16      = true;
    } else if (cont16) {
      // N day that is continuation of previous E — mark as continuation
      displayType  = 'Night (cont.)';
      displayStart = '00:00';
      displayEnd   = '08:00';
      badge16      = true;
    }

    result.push({
      empName: name,
      shiftCode: code,
      shiftType: displayType,
      shiftStart: displayStart,
      shiftEnd: displayEnd,
      is16hr: badge16,
      is16hrStart: start16,
      is16hrCont: cont16,
      inSchedule: true,
    });
  });

  SHIFT_DAY_ONLY.forEach(name => {
    const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(dateISO + 'T12:00:00').getDay()];
    const isWeekOff = WEEK_OFF[name] && WEEK_OFF[name].toLowerCase() === dayName.toLowerCase();
    const code = isWeekOff ? 'OFF' : 'D';
    const info = SHIFT_CODE_MAP[code];
    result.push({
      empName: name,
      shiftCode: code,
      shiftType: info.type,
      shiftStart: info.start,
      shiftEnd: info.end,
      is16hr: false,
      is16hrStart: false,
      is16hrCont: false,
      inSchedule: false,
    });
  });
  return result;
}

// For count table — count unique employees on duty (E start counts as 1, N cont skipped to avoid double-count)
function getShiftCountsForDate(dateISO) {
  const recs = getShiftForDate(dateISO);
  const counts = { Day:0, Evening:0, Night:0, OFF:0, '16hr':0 };
  const names  = { Day:[], Evening:[], Night:[], OFF:[], '16hr':[] };
  recs.forEach(s => {
    if (s.is16hrStart) {
      counts['16hr']++;
      names['16hr'].push(s.empName);
    } else if (s.is16hrCont) {
      // already counted on E day — skip to avoid double count
    } else {
      const base = s.shiftCode === 'D' ? 'Day'
                 : s.shiftCode === 'E' ? 'Evening'
                 : s.shiftCode === 'N' ? 'Night'
                 : 'OFF';
      if (counts[base] !== undefined) {
        counts[base]++;
        names[base].push(s.empName);
      }
    }
  });
  const onDuty = counts.Day + counts.Evening + counts.Night + counts['16hr'];
  return { counts, names, onDuty };
}
